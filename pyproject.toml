[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-decision-lab"
version = "0.1.0"
description = "An auditable synthetic pick-and-pack staffing research prototype"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
dependencies = ["simpy==4.1.2", "Flask==3.1.3", "waitress==3.0.2"]

[project.scripts]
decision-lab = "decision_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_lab = ["static/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".research-sources", ".venv-clean", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/decision_lab"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
